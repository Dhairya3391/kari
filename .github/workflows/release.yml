name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: android
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh target ${{ matrix.os }} ${{ matrix.arch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kari-${{ matrix.os }}-${{ matrix.arch }}
          path: kari*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: ./artifacts
          pattern: kari-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ./artifacts/*
