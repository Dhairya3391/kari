name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: android
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh target ${{ matrix.os }} ${{ matrix.arch }}

      - name: Upload Artifact
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kari-${{ matrix.os }}-${{ matrix.arch }}
          path: kari-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error
          # A retry after a failed finalization may find an artifact that was
          # partially registered; replacing it is safe because each matrix job
          # owns a distinct artifact name.
          overwrite: true

      # GitHub's artifact service intermittently answers finalization with an
      # HTML error page instead of JSON. Re-uploading recovers without a rebuild.
      - name: Retry Artifact Upload (2)
        id: upload_retry
        if: always() && steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kari-${{ matrix.os }}-${{ matrix.arch }}
          path: kari-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error
          overwrite: true

      - name: Retry Artifact Upload (3)
        if: always() && steps.upload.outcome == 'failure' && steps.upload_retry.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kari-${{ matrix.os }}-${{ matrix.arch }}
          path: kari-${{ matrix.os }}-${{ matrix.arch }}*
          if-no-files-found: error
          overwrite: true

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: ./artifacts
          pattern: kari-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ./artifacts/*
