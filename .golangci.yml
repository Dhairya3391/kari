version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocyclo
    - funlen
    - unconvert
    - misspell

linters-settings:
  gocyclo:
    min-complexity: 15
  funlen:
    lines: 60
    statements: 40
  revive:
    rules:
      - name: exported
        disabled: false
      - name: var-naming
        disabled: false
      - name: package-comments
        disabled: false
      - name: error-strings
        disabled: false
      - name: error-naming
        disabled: false
  errcheck:
    check-type-assertions: false
    check-blank: false

issues:
  exclude-dirs:
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
